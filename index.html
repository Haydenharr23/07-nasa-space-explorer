<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <div class="brand-copy">
        <p class="brand-kicker">NASA / ASTRONOMY PICTURE OF THE DAY</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <section class="search-panel" aria-labelledby="date-panel-title">
      <div class="search-panel-heading">
        <h2 id="date-panel-title">Explore the archive</h2>
        <p>Choose a nine-day window in NASA's daily image collection.</p>
      </div>
      <div class="filters">
        <div class="date-field">
          <label for="startDate">Start date</label>
          <input type="date" id="startDate" />
        </div>
        <div class="date-field">
          <label for="endDate">End date</label>
          <input type="date" id="endDate" />
        </div>
        <div class="date-field">
          <label for="apiKey">NASA API key</label>
          <input type="password" id="apiKey" autocomplete="off" placeholder="Enter your API key" />
        </div>
        <button class="get-images-button" type="button">Get Space Images</button>
      </div>
    </section>

    <section class="space-fact" aria-labelledby="space-fact-title">
      <div class="space-fact-icon" aria-hidden="true">&#10022;</div>
      <div class="space-fact-copy">
        <h2 id="space-fact-title">Did You Know?</h2>
        <p id="spaceFact" aria-live="polite"></p>
      </div>
    </section>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog id="apodModal" class="apod-modal" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalExplanation">
    <div class="modal-content">
      <button id="modalClose" class="modal-close" type="button" aria-label="Close image details">&times;</button>
      <div class="modal-media">
        <img id="modalImage" class="modal-image" alt="" />
        <div id="modalMediaFallback" class="modal-media-fallback" hidden>
          <span id="modalFallbackIcon" class="video-play-icon" aria-hidden="true">&#9654;</span>
          <p id="modalFallbackText"></p>
        </div>
        <span id="modalVideoBadge" class="video-label modal-video-badge" hidden>VIDEO PREVIEW</span>
      </div>
      <div class="modal-copy">
        <p id="modalDate" class="modal-date"></p>
        <h2 id="modalTitle"></h2>
        <a id="modalVideoLink" class="modal-video-link" href="" target="_blank" rel="noopener noreferrer" hidden>Open APOD video in a new tab</a>
        <p id="modalExplanation"></p>
      </div>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
